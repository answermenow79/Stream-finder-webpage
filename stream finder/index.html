<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFinder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen">
    <main class="max-w-5xl mx-auto px-6 py-12">
        <h1 id="mainTitle" class="text-4xl font-bold text-center">
            StreamFinder
        </h1>
        <p id="message" class="text-slate-400 text-center mt-3">
            Find your next TV show.
        </p>
        <div class="felx gap-2 max-w-5xl mx-auto mt-8">
            <input id="searchInput" type="text" placeholder="Search for a show..."
                class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-lg font-semibold">

            <button id="searchBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-semibold">
                Search
            </button>

            <button id="randomBtn" class="bg-purple-600 hover:bg-purple-500 px-5 py-3 rounded-lg font-semibold">
                Random Pick
            </button>
        </div>
        <section id="results" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-10">
        </section>

        <section class="max-w-5xl mx-auto px-6 mt-12 border-t border-slate-800 pt-8">
            <h2 class="text-2xl font-bold flex items-center gap-2">
                My Watchlist <span id="watchlistCount" class=""></span>
            </h2>
        </section>

    </main>
    <script src="script.js"></script>
</body>

</html>
